<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-school" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4682B4" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
  </defs>

  <!-- School Emblem Shield Frame -->
  <path d="M 200,20 L 350,80 L 350,260 Q 200,380 50,260 L 50,80 Z" fill="url(#grad-school)" stroke="#FF6700" stroke-width="8" />
  
  <!-- Inner Frame -->
  <path d="M 200,40 L 330,95 L 330,245 Q 200,350 70,245 L 70,95 Z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 4" opacity="0.6" />

  <!-- Gear & Flame Academic Icon -->
  <g transform="translate(200, 180)">
    <!-- Gear outer -->
    <circle cx="0" cy="0" r="65" fill="none" stroke="#4682B4" stroke-width="12" />
    <!-- Gear teeth -->
    <rect x="-8" y="-80" width="16" height="20" fill="#4682B4" />
    <rect x="-8" y="60" width="16" height="20" fill="#4682B4" />
    <rect x="-80" y="-8" width="20" height="16" fill="#4682B4" />
    <rect x="60" y="-8" width="20" height="16" fill="#4682B4" />

    <!-- Book & Torch Symbol -->
    <path d="M -35,15 Q 0,0 35,15 L 35,40 Q 0,25 -35,40 Z" fill="#FFFFFF" />
    <path d="M 0,-30 C -15,-10 0,10 0,10 C 0,10 15,-10 0,-30 Z" fill="#FF6700" />
  </g>

  <!-- Banner Text -->
  <rect x="60" y="300" width="280" height="40" rx="8" fill="#FF6700" />
  <text x="200" y="326" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SMK N 1 MAS UBUD</text>
</svg>