<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <pattern id="cyberGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#4682B4" stroke-width="1" opacity="0.1" />
      <circle cx="0" cy="0" r="1.5" fill="#4682B4" opacity="0.3" />
    </pattern>
    <linearGradient id="overlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0B1120" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0.95" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#0B1120" />
  <rect width="100%" height="100%" fill="url(#cyberGrid)" />
  <rect width="100%" height="100%" fill="url(#overlay)" />
</svg>