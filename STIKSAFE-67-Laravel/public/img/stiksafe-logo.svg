<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#4682B4" stroke-width="1" stroke-opacity="0.15" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Container Background -->
  <rect width="500" height="500" rx="32" fill="#0B1120"/>
  <rect width="500" height="500" rx="32" fill="url(#grid)"/>

  <!-- Minimalist Geometric Block "S" Logo -->
  <g transform="translate(50, 50)">
    <!-- Top Horizontal Block (Steel Blue) -->
    <rect x="80" y="60" width="240" height="55" rx="8" fill="#4682B4" />
    
    <!-- Top Left Vertical Block (Steel Blue) -->
    <rect x="80" y="60" width="60" height="150" rx="8" fill="#4682B4" />
    
    <!-- Center Horizontal Block (Transition: Steel Blue to Safety Orange accent) -->
    <rect x="80" y="155" width="240" height="55" rx="8" fill="#FF6700" />
    
    <!-- Bottom Right Vertical Block (Safety Orange) -->
    <rect x="260" y="155" width="60" height="150" rx="8" fill="#FF6700" />
    
    <!-- Bottom Horizontal Block (Steel Blue & Orange corner) -->
    <rect x="80" y="250" width="240" height="55" rx="8" fill="#4682B4" />

    <!-- Sharp Geometric Corner Cutouts / Accents -->
    <polygon points="320,60 340,60 340,115" fill="#FF6700" />
    <polygon points="60,250 80,250 60,305" fill="#4682B4" />

    <!-- Center Security Node Dot -->
    <circle cx="200" cy="182.5" r="10" fill="#FFFFFF" filter="url(#glow)" />
  </g>
</svg>